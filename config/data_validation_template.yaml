# 数据质量硬约束模板
schema_version: "V5.5.24.3"
# 每次分析前必须填写此模板，数据不通过校验则阻止生成报告
# 
# 使用说明：
# 1. 复制此文件为 config/validation_{stock_code}.yaml
# 2. 逐项填写数据，必须标注来源和页码
# 3. 运行 python scripts/validate_data.py config/validation_{stock_code}.yaml
# 4. 校验通过后才能生成报告

analysis_metadata:
  stock_code: "03613.HK"  # 股票代码
  stock_name: "同仁堂国药"  # 公司名称
  report_date: "2026-03-20"  # 报告日期
  analyst: ""  # 分析人员
  annual_report_year: 2025  # 使用的年报年份（强制）
  annual_report_date: "2026-03-20"  # 年报发布日期
  listing_board: "港股主板"  # 港股主板/A股主板/科创板/创业板/其他
  workflow_status: "标准分析"  # 排除/独立高风险研究/标准分析
  shareholder_relationship: "公司养股东"  # 公司养股东/相互供养/股东养公司/资本退出工具
  explicit_high_risk_request: false  # 科创板/创业板只有用户明确要求时才可设为true

  # 时效性控制（强化）
  data_freshness_control:
    current_date: "2026-03-22"  # 分析当日日期
    data_age_days: 0  # 自动计算：当前日期 - 年报发布日期
    max_allowed_age_days: 365  # 数据最大有效天数（1年）
    # 数据优先级：年报 > 中报 > 季报 > 预告
    # S级数据强制要求：必须使用最新完整年度年报
    # 例外情况：年报未发布时，使用最新中报，但必须降级置信度为B级

  # 报告类型检查
  report_type: "annual"  # annual/interim/quarter/preliminary
  is_latest_full_year: true  # 是否是最新完整年度年报
  next_year_available: false  # 下一年度报告是否已发布（如已发布则当前数据过时）

  # 估值数据时点（V5.5.23新增）
  valuation_policy:
    primary_method: "PE"  # PE/PB/DPU_FFO/MID_CYCLE/PS/PROBABILITY_WEIGHTED
    pe_applicable: true
    fcf_applicable: true  # REITs等不适用报告口径FCF时填false，相关数值保持null
    fcf_unavailable_reason: ""  # fcf_applicable=false时必填
    price_as_of: "2026-03-20"
    fx_as_of: "2026-03-20"
    calculation_currency: "HKD"  # 所有估值分子、分母统一使用的币种
    share_price_to_calculation_currency_rate: 1.0  # 1单位交易币种折合多少计算币种；同币种填1
    fx_source: ""  # 交易所、央行或可信金融数据源
    ttm_period: "2025-04-01/2026-03-31"
    ttm_method: "ANNUAL_PLUS_INTERIM"  # FOUR_QUARTERS/ANNUAL_PLUS_INTERIM/NOT_AVAILABLE
    ttm_unavailable_reason: ""  # ttm_method=NOT_AVAILABLE时必填

  data_confidence_level: "S"  # 整体置信度 S/A/B/C/D

  # 时点检查（强制勾选）- 强化版
  validation_checks:
    - check: "使用的是最新完整年度年报（非中报/季报/预告）"
      checked: false  # 必须改为 true
    - check: "年报发布日期不早于去年今日"
      checked: false
    - check: "如果年报未发布，已明确标注并使用中报（置信度降级）"
      checked: false
    - check: "非预告/快报数据，为正式审计报告"
      checked: false
    - check: "已对比至少3年历史数据"
      checked: false
    - check: "核心财务数据（现金、负债、利润、现金流）来自年报原文"
      checked: false

core_financial_data:
  # ========== 现金数据（S级强制）==========
  cash_and_bank_balances:
    value: 0  # 原始数字，不含单位（如2279000000）
    unit: "HKD"  # HKD/RMB
    display_unit: "亿港元"  # 显示单位
    source: ""  # 必须：年报附注编号（如annual_report_note_22）
    page_number: 0  # 必须：年报页码
    report_period: "2025-12-31"  # 报表期
    confidence: "S"  # 必须是S
    verification_checked: false  # 必须改为 true
    notes: ""  # 备注（如是否含受限存款）

  cash_and_cash_equivalents:
    value: 0  # 原始期限通常不超过3个月、用于满足短期现金承诺的现金
    unit: "HKD"
    source: ""
    page_number: 0
    report_period: "2025-12-31"
    confidence: "S"
    verification_checked: false
    notes: ""  # 必须说明是否含受限现金、关联方财务公司存款

  time_deposits_over_three_months:
    value: 0  # 原始期限超过3个月的定期存款；即使能提前支取也不得计入即时现金
    unit: "HKD"
    source: ""
    page_number: 0
    confidence: "S"

  related_financial_institution_deposits:
    value: 0  # 存放于控股股东/关联方财务公司的款项，即使会计上属于现金等价物也单列
    included_in_cash_and_cash_equivalents: false
    unit: "HKD"
    source: ""
    page_number: 0
    confidence: "S"

  other_low_liquidity_cash:
    value: 0  # 其他低流动性、不可自由归属或需审慎扣减的现金
    unit: "HKD"
    source: ""
    page_number: 0
    confidence: "S"
    notes: ""
  
  restricted_cash:
    value: 0  # 受限制存款（需从现金中扣除）
    source: ""
    page_number: 0
    confidence: "S"
  
  # ========== 负债数据（S级强制）==========
  interest_bearing_debt:
    short_term:
      value: 0  # 短期借款
      source: ""  # 如annual_report_note_29
      page_number: 0
      report_period: "2025-12-31"  # 报表期
      confidence: "S"
    
    long_term:
      value: 0  # 长期借款
      source: ""
      page_number: 0
      report_period: "2025-12-31"  # 报表期
      confidence: "S"
    
    bonds:
      value: 0  # 债券
      source: ""
      page_number: 0
      report_period: "2025-12-31"  # 报表期
      confidence: "S"
    
    lease_liabilities:
      value: 0  # 租赁负债
      source: ""
      page_number: 0
      report_period: "2025-12-31"  # 报表期
      confidence: "S"
    
    # 自动计算（不要修改）
    total_calculation: "short_term + long_term + bonds + lease_liabilities"
    total_value: 0  # 自动计算
    confidence: "S"
  
  total_liabilities:
    value: 0  # 总负债（用于计算负债率）
    source: ""
    page_number: 0
    confidence: "S"
  
  # ========== 利润数据（S级强制）==========
  revenue:
    value: 0
    unit: "HKD"
    display_unit: "亿港元"
    source: ""
    page_number: 0
    report_period: "2025-12-31"  # 报表期
    confidence: "S"
  
  net_profit:
    value: 0  # 净利润（含少数股东权益）
    unit: "HKD"
    display_unit: "亿港元"
    source: ""
    page_number: 0
    report_period: "2025-12-31"  # 报表期
    confidence: "S"
  
  net_profit_attributable:
    value: 0  # 归母净利润
    unit: "HKD"
    display_unit: "亿港元"
    source: ""
    page_number: 0
    report_period: "2025-12-31"  # 报表期
    confidence: "S"

  # TTM组成项。季度制填4个operator=1；港股常见半年制填“最近年度+本期中期-上年同期中期”。
  ttm_components:
    - role: "latest_annual"
      period: "2025FY"
      operator: 1
      value: 0
      unit: "HKD"
      source: ""
      page_number: 0
      confidence: "S"
    - role: "current_interim"
      period: "2026H1"
      operator: 1
      value: 0
      unit: "HKD"
      source: ""
      page_number: 0
      confidence: "S"
    - role: "prior_interim"
      period: "2025H1"
      operator: -1
      value: 0
      unit: "HKD"
      source: ""
      page_number: 0
      confidence: "S"
  
  non_recurring_items:
    government_subsidy: 0  # 政府补贴
    gain_on_disposal: 0  # 出售资产收益
    total: 0  # 非经常性损益合计

  # ========== 利润质量三层桥接（V5.5.24-r5）==========
  impairment_breakdown:
    total:
      value: 0
      unit: "HKD"
      source: ""
      page_number: 0
    direction_flip_after_adjustment: false  # 剔除允许调整项后，利润同比方向是否反转
    items: []
    # 触发时逐项填写示例：
    # - type: "goodwill"  # goodwill/inventory/receivable_credit/guarantee/factoring/microloan/fixed_asset/other
    #   amount: 0
    #   unit: "HKD"
    #   source: ""
    #   page_number: 0

  profit_quality:
    bridge_required: false  # 由校验器按减值规模/类型复核，不得自行规避
    reported_profit:
      value: null
      unit: "HKD"
    normalized_profit:
      value: null
      unit: "HKD"
    normalized_ttm_profit:
      value: null
      unit: "HKD"
    normalized_ttm_pe:
      value: null
    adjustment_items: []
    # 触发时逐项填写示例：
    # - type: "goodwill"
    #   amount: 0
    #   after_tax_amount: 0
    #   attributable_amount: 0  # 纳入正常化利润的归母影响额；加回损失为正、剔除收益为负
    #   cash_impact: "none_current_period"  # none_current_period/current_outflow/future_risk
    #   recurring: false
    #   add_back_allowed: true
    #   rationale: ""
    #   remaining_exposure: ""
    #   source: ""
    #   page_number: 0
    conclusion: ""
  
  # ========== 现金流数据（S级强制）==========
  operating_cash_flow:
    value: 0
    unit: "HKD"
    display_unit: "亿港元"
    source: "cash_flow_statement"  # 现金流量表
    page_number: 0
    report_period: "2025-12-31"
    confidence: "S"
    verification_checked: false
  
  capex:
    value: 0  # 资本开支（购置固定资产支出）
    unit: "HKD"
    source: "cash_flow_statement_investing"  # 投资活动现金流
    page_number: 0
    report_period: "2025-12-31"  # 报表期
    confidence: "S"
    # 注意：必须明确数值，即使为0也要填写
  
  dividends_paid:
    value: 0  # 派息金额
    unit: "HKD"
    source: "cash_flow_statement_financing"  # 筹资活动现金流

  dividend_per_share_for_yield:
    value: 0  # 实际或已批准每股股息；零派息明确填0
    currency: "HKD"  # 必须与share_price.currency一致
    period: "2025FY"
    source: ""
    page_number: 0
    confidence: "S"
  
  # ========== 股本数据（S级强制）==========
  total_shares:
    value: 0  # 总股本（股）
    source: ""
    page_number: 0
    confidence: "S"
  
  share_price:
    value: 0  # 当前股价
    currency: "HKD"
    date: "2026-03-20"
    source: "hkex"  # hkex/bloomberg
  
  market_cap:
    calculation: "total_shares * share_price * share_price_to_calculation_currency_rate"
    value: 0  # 自动计算
    unit: "HKD"  # 必须等于valuation_policy.calculation_currency
    display_unit: "亿港元"
  
  # ========== 计算指标（自动计算）==========
  calculated_metrics:
    immediate_net_cash:
      formula: "cash_and_cash_equivalents - restricted_cash - interest_bearing_debt.total"
      value: 0
      display_value: ""
      market_cap_ratio: 0
      notes: ""  # 必须回答能否立即动用；不得直接写成可自由分红现金
      confidence: "A"

    conservative_immediate_net_cash:
      formula: "immediate_net_cash - related_financial_institution_deposits_in_cash_equivalents - other_low_liquidity_cash"
      value: 0
      display_value: ""
      market_cap_ratio: 0
      notes: ""
      confidence: "A"

    net_cash:
      formula: "cash_and_bank_balances - restricted_cash - interest_bearing_debt.total"
      value: 0  # 自动计算
      display_value: ""  # 如"22.73亿港元"
      market_cap_ratio: 0
      notes: "广义净现金口径；必须说明是否含超过3个月定期存款"
      confidence: "A"  # 计算值自动降级为A
    
    fcf:
      formula: "operating_cash_flow - capex"
      value: 0  # 自动计算
      display_value: ""
      confidence: "A"

    maintenance_fcf:
      formula: "operating_cash_flow - maintenance_capex_range"
      low_value: 0
      high_value: 0
      estimate_basis: ""
      confidence: "B"
    
    market_cap_ex_cash:
      formula: "market_cap - net_cash"
      value: 0  # 自动计算
      display_value: ""
    
    fcf_yield:
      formula: "fcf / market_cap"
      value: 0  # 自动计算（如0.12表示12%）
      display_value: ""

    fcf_multiple_market:
      formula: "market_cap / fcf"
      value: 0  # FCF<=0时为null并说明不适用
      display_value: ""

    multi_period_fcf:
      method: "TWO_YEAR_AVERAGE"  # TWO_YEAR_AVERAGE/THREE_YEAR_AVERAGE/NOT_AVAILABLE
      periods:
        - period: "2024FY"
          value: 0
          source: ""
          page_number: 0
        - period: "2025FY"
          value: 0
          source: ""
          page_number: 0
      average_value: 0
      market_cap_yield: 0
      unavailable_reason: ""
      confidence: "A"

    dividend_yield:
      formula: "dividend_per_share_for_yield / share_price"
      value: 0
      display_value: ""
      notes: "股息是FCF的分配组成，不得与FCF收益率相加"
    
    fcf_multiple_ex_cash:
      formula: "market_cap_ex_cash / fcf"
      value: 0  # 自动计算
      display_value: ""
    
    pe_ratio:
      formula: "market_cap / net_profit_attributable"
      value: 0  # 自动计算
      display_value: ""

    static_pe:
      formula: "market_cap / net_profit_attributable"
      value: 0
      display_value: ""

    ttm_net_profit:
      formula: "sum(ttm_components.operator * ttm_components.value)"
      value: null  # ttm_method=NOT_AVAILABLE时保持null
      display_value: ""

    ttm_pe:
      formula: "market_cap / ttm_net_profit"
      value: null  # ttm_method=NOT_AVAILABLE时保持null
      display_value: ""

    normalized_ttm_pe:
      formula: "market_cap / profit_quality.normalized_ttm_profit"
      value: null  # 仅利润桥接触发且TTM可计算时填写
      display_value: ""
    
    pb_ratio:
      formula: "market_cap / net_assets"
      value: 0  # 自动计算
      display_value: ""
    
    debt_to_asset_ratio:
      formula: "total_liabilities / total_assets"
      value: 0  # 自动计算
      display_value: ""
    
    cash_to_market_cap_ratio:
      formula: "net_cash / market_cap"
      value: 0  # 自动计算（如0.33表示33%）
      display_value: ""

