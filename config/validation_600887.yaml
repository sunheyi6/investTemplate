  implicit_support:
    exists: true
    rationale: 伊利持有优然36.07%并与其存在大额采购及产业链关系，具有商业支持动机；中报未披露为优然全部债务提供担保或资金拆借。
  funding_cost_assessment: 2026H1财务费用-5.26亿元，表明净利息收入和融资价格有利，但不证明无债务或可无损切割。
  solvency_and_cutoff_assessment: 伊利自身现金流稳定；优然负债未并表，已披露直接资产敞口有限，但权益投资、采购依赖及潜在新增支持构成尾部风险。
  stress_test_completed: true
  stress_scenarios:
  - scenario: base
    expected_support_loss: 0
    unit: RMB
    impact_on_net_cash_fcf_dividend: 不假设新增救助；持续监控90.76亿元担保、32.38亿元保理小贷资产及短债滚续。
  - scenario: downside
    expected_support_loss: 6201068000
    unit: RMB
    impact_on_net_cash_fcf_dividend: 机械组合优然权益投资全部减值、已披露直接资产敞口及存款集中提取；约为0.55倍2025年FCF，显著侵蚀合并净现金，但不是预测值。
  conclusion: 存在信用链尾部风险，负财务费用不是偿付安全证明；优然263.80亿元负债不等于伊利法定连带债务，新增担保、贷款或注资才触发进一步损失重估。
