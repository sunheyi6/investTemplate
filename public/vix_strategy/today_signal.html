<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIX今日操作</title>
<style>
*{box-sizing:border-box} body{margin:0;padding:12px;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#111827}
.card{border:1px solid #bfdbfe;background:#eff6ff;border-radius:14px;padding:20px;box-shadow:0 4px 16px rgba(15,23,42,.06)}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap} h2{font-size:18px;margin:0 0 8px} .action{font-size:22px;font-weight:750;color:#1d4ed8;margin:0}
.badge{padding:5px 10px;border-radius:999px;border:1px solid #bfdbfe;color:#1d4ed8;font-size:13px;font-weight:650;background:#fff9}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px} .item{background:#fff9;border:1px solid #bfdbfe;border-radius:10px;padding:12px}
.label{font-size:12px;color:#6b7280;margin-bottom:5px} .value{font-size:17px;font-weight:700} .foot{font-size:12px;color:#6b7280;margin:14px 0 0;line-height:1.6}
@media(max-width:680px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.action{font-size:19px}}
</style>
</head>
<body>
<section class="card">
  <div class="top">
    <div><h2 id="signal-title">VIX今日操作 · 2026-09-12</h2><p class="action">今日周末休市，无需操作</p></div>
    <span class="badge">数据正常</span>
  </div>
  <div class="grid">
    <div class="item"><div class="label">最新VIX</div><div class="value">15.84</div></div>
    <div class="item"><div class="label">当前档位</div><div class="value">正常定投</div></div>
    <div class="item"><div class="label">当前档位金额</div><div class="value">5,000元</div></div>
    <div class="item"><div class="label">下次定投</div><div class="value">2026-09-15</div></div>
  </div>
  <p class="foot">VIX数据日：2026-09-11 · 来源：Cboe VIX历史收盘数据<br>参考美国上一交易日VIX收盘值；实盘下单前检查513110溢价并使用限价单。</p>
  <p class="foot" id="signal-freshness">提示生成日：2026-09-12（北京时间）</p>
</section>
<script>
const signalDate = "2026-09-12";
function refreshDisplay() {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit'
  }).formatToParts(new Date());
  const fields = Object.fromEntries(parts.map(part => [part.type, part.value]));
  const today = `${fields.year}-${fields.month}-${fields.day}`;
  if (today === signalDate) return;
  const weekend = [0, 6].includes(new Date(today + 'T00:00:00Z').getUTCDay());
  document.getElementById('signal-title').textContent = 'VIX今日操作 · ' + today;
  document.querySelector('.action').textContent = weekend
    ? '今日周末休市，无需操作'
    : '今日操作提示尚未更新，请等待更新后核对';
  document.querySelector('.badge').textContent = weekend ? '周末休市' : '提示待更新';
  document.getElementById('signal-freshness').textContent =
    '上次提示生成日：' + signalDate + '（北京时间）；以上行情与档位仅供历史参考。';
  document.querySelector('.action').style.color = '#c2410c';
}
refreshDisplay();
setInterval(refreshDisplay, 60000);
document.addEventListener('visibilitychange', refreshDisplay);
</script>
</body>
</html>
